[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitnium"
version = "0.1.0"
description = "Execution receipts for AI agents: contain, deterministically reconstruct, and cryptographically certify a run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vitnium" }]
keywords = ["ai-agents", "security", "execution-certificate", "deterministic-inference", "reproducibility", "audit"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["blake3>=0.4", "cryptography>=41"]

[project.optional-dependencies]
langgraph = ["langgraph", "langchain-core"]
mcp = ["mcp"]

[project.urls]
Homepage = "https://vitnium.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vitnium._vendor.pck" = ["*.py"]
