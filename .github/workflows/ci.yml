name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Runs the level-1 (offline integrity), unit, capability-containment, ed25519,
      # and attack-matrix suites. The level-2 recomputation tests skip automatically
      # unless VITNI_GGUF and VITNI_RECEIPT_BIN are set (no model/engine in CI), and
      # the adapter tests skip unless the optional [langgraph]/[mcp] extras are present.
      - name: Run tests
        run: python -m pytest

      # The public evidence artifacts run in CI too, so a change (e.g. a default flip)
      # can never leave them asserting the verifier is broken or reporting a false green.
      # The adversarial suite exits non-zero if any attack is accepted or a control fails.
      - name: Adversarial probe suite
        run: python adversarial/probe_suite.py

      # Model-free example scripts must run clean (the ones needing a GGUF/engine are
      # excluded — they require VITNI_GGUF + VITNI_RECEIPT_BIN, absent in CI).
      - name: Example scripts (model-free)
        run: |
          for f in redact_demo attack_matrix test_ed25519 test_foundation; do
            echo "== examples/$f.py =="
            python "examples/$f.py"
          done
