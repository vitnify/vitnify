name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Runs the level-1 (offline integrity), unit, capability-containment, ed25519,
      # and attack-matrix suites. The level-2 recomputation tests skip automatically
      # unless VITNI_GGUF and VITNI_RECEIPT_BIN are set (no model/engine in CI), and
      # the adapter tests skip unless the optional [langgraph]/[mcp] extras are present.
      - name: Run tests
        run: python -m pytest
